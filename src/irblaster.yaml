esphome:
  name: "irblaster"
  friendly_name: IRBlaster
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf 

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

remote_transmitter:
  - id: ir_transmitter
    pin: GPIO19   #GPIO23=D5 & GPIO19=D8
    carrier_duty_percent: 50%

button:
  - platform: template
    name: "Power On"
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_transmitter
          address: 0x5583      # 
          command: 0x6F90      # 

  - platform: template
    name: "Power Off"
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_transmitter
          address: 0x5583
          command: 0x6E91      # 
