esphome:
  name: rf-transceiver-1
  friendly_name: RF Transceiver 1
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - cc1101.begin_rx

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

api:
  encryption:
    key: "ReplaceThisWithAKeyThatWorks"
    
ota:
  - platform: esphome

logger:
  level: DEBUG

spi:
  clk_pin: GPIO19    # D8 - SCK
  mosi_pin: GPIO18   # D10 - MOSI
  miso_pin: GPIO20   # D9 - MISO

cc1101:
  cs_pin: GPIO21      # D3 - CSN
  frequency: 304.23MHz
  modulation_type: ASK/OOK

remote_receiver:
  id: cc1101_capture
  pin: GPIO1           # D1 - GDO2
  dump: raw
  idle: 15ms
  filter: 100us
  tolerance: 25%
  buffer_size: 10kb

remote_transmitter:
  id: cc1101_tx
  pin: GPIO2            # D2 - GDO0
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

# --- Capture / re-arm button (kept for future captures, e.g. resolving reverse) ---
button:
  - platform: template
    name: "Capture 304MHz RF"
    id: capture_rf_button
    on_press:
      - cc1101.begin_rx
      - logger.log: "CC1101 armed - press the remote button now"

  # --- Remote 1 ---
